server:
  port: 8080

spring:
  datasource:
    username: ${USERNAME}
    password: ${PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://database-1.cvo0mcig6l5w.ap-northeast-2.rds.amazonaws.com:3306/farm_plus?useUnicode=true&characterEncoding=UTF-8
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: none
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

jwt:
  secret-key-source: ${SECRET_KEY}  # JWT 비밀키

security:
  oauth2:
    client:
      registration:
        kakao:
          client-id: YOUR_KAKAO_REST_API_KEY  # 카카오 REST API 키
          client-authentication-method: post
          authorization-grant-type: authorization_code
          redirect-uri: "{baseUrl}/auth/kakao/callback"
          scope: profile_nickname, account_email
      provider:
        kakao:
          authorization-uri: https://kauth.kakao.com/oauth/authorize
          token-uri: https://kauth.kakao.com/oauth/token
          user-info-uri: https://kapi.kakao.com/v2/user/me

  data:
    redis:
      #host: localhost
      host: ENC(n60mvykJRU2R5SBqLmUiyatj973/jexg) #ENC(4i+ka2OLOJPRQUSzIXfseA6RSvcUhwx7) # 추후 ec2 프라이빗 아이피로 변경 필요2.
      port: 6379
gradle:
  java:
    home: "/usr/lib/jvm/java-17-openjdk-amd64"